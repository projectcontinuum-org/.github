name: Feature request
description: Suggest an idea or a new node
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior or node you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with some guidance"
        - "No, I'm just suggesting it"
    validations:
      required: true
