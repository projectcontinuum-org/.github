name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        For security problems, don't use this form. See the [security policy](https://github.com/projectcontinuum-org/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or image tag of the affected component.
      placeholder: "0.0.20"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Continuum?
      options:
        - Docker Compose (continuum-local-setup)
        - Kubernetes (Helm charts)
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant log output or screenshots. Remove any secrets first.
      render: shell
